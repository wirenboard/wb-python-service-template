[pytest]
# wb/ adds the doctests, tests/ the suite. Both are spelled out because pybuild calls "pytest
# tests" and that path overrides testpaths, while a bare local "pytest" collects only these.
addopts = -v --doctest-modules wb tests
# Puts the project root into sys.path, otherwise "import wb" fails. Resolved against this file,
# which pybuild copies into the build directory.
pythonpath = .
