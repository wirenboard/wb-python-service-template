[pytest]
# Both directories are listed on purpose. Without wb the doctests never reach the package,
# because the explicit tests path pybuild passes overrides testpaths. Without tests a bare
# pytest run collects wb only and the regular tests drop out.
addopts = -v --doctest-modules wb tests
# Plain pytest does not put the current directory on sys.path, so without this the package
# cannot be imported. Resolved against this file, which pybuild copies to the build directory.
pythonpath = .
